name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g wrangler 2>/dev/null
          OUTPUT=$(wrangler pages deploy . --project-name speakerai --commit-dirty=true 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev[^ ]*' | head -1)
          echo "Deployment URL: $URL"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"DEPLOYMENT_URL\",\"value\":\"${URL}\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables" || \
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"value\":\"${URL}\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables/DEPLOYMENT_URL"
