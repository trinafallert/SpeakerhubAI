name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler 2>/dev/null
          wrangler pages deploy . --project-name speakerai --commit-dirty=true 2>&1 | tee /tmp/deploy_output.txt
          echo "EXIT: ${PIPESTATUS[0]}" >> /tmp/deploy_output.txt

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: /tmp/deploy_output.txt
          retention-days: 1
