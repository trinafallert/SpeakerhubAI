name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npm install -g wrangler 2>&1
          DEPLOY_OUT=$(wrangler pages deploy . --project-name speakerai --commit-dirty=true 2>&1)
          DEPLOY_EXIT=$?
          echo "=== WRANGLER OUTPUT ==="
          echo "$DEPLOY_OUT"
          echo "=== EXIT: $DEPLOY_EXIT ==="
          echo "$DEPLOY_OUT" > deploy_status.txt
          echo "exit=$DEPLOY_EXIT" >> deploy_status.txt
          git config user.email "ci@speakerai"
          git config user.name "CI"
          git add deploy_status.txt
          git diff --cached --quiet || git commit -m "ci: deploy status [skip ci]"
          git push origin HEAD || true
          exit $DEPLOY_EXIT
